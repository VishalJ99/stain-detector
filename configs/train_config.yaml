data:
  data_dir: ./data
  image_size: 224
  batch_size: 64
  mpp: 0.5
  num_classes: 2  # Set this to the expected number of stain classes

model:
  name: resnet50 # Initial requirement
  pretrained: true

optimizer:
  name: AdamW
  lr: 0.001
  weight_decay: 0.01

scheduler: # Optional
  name: CosineAnnealingLR
  params: { T_max: 20 }

training:
  num_epochs: 25
  device: cuda
  seed: 42

inference_defaults:
  patch_size: ${data.image_size}
  num_patches: 1000 # Max patches to sample per WSI
  tissue_threshold: 0.05 # Based on user code for HSV filtering
  overlap: 0 # Patch overlap factor (0-1)
  level: 0 # WSI level to extract patches from
  inference_batch_size: 64
  save_patches: false

logging:
  log_interval_steps: 5
  log_val_batch_idx: 0 # Index for validation batch logging (-1 to disable)
  wandb_project: stain-detector
  wandb_entity: temp
  run_dir: runs
